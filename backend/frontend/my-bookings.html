<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Bookings — YeoUn</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍖</text></svg>">
  <link rel="stylesheet" href="css/style.css?v=20260325-2">
</head>
<body>

<!-- ========== 내비게이션 ========== -->
<nav>
  <div class="nav-inner">
    <a href="index.html" class="nav-logo">
      <span class="logo-ko">여운</span>
      <span class="logo-en">YeoUn Travel</span>
    </a>
    <div class="nav-links">
      <a href="index.html" data-i18n="nav_tours">Tours</a>
      <a href="my-bookings.html" class="active" data-i18n="nav_bookings">My Bookings</a>
    </div>
    <div class="lang-switcher">
      <button class="lang-btn" data-lang="ko">한</button>
      <button class="lang-btn" data-lang="en">EN</button>
      <button class="lang-btn" data-lang="zh">中文</button>
    </div>
  </div>
</nav>

<div class="container" style="max-width: 820px;">
  <div class="section-header">
    <p class="section-title" data-i18n="my_title">My Bookings</p>
    <p class="section-sub" data-i18n="my_sub">Enter the email you used when booking.</p>
  </div>

  <!-- 이메일 검색 -->
  <div class="email-search">
    <div class="form-group">
      <label for="email-input" data-i18n="label_email_search">Email Address</label>
      <input type="email" id="email-input" data-i18n-placeholder="ph_email_search" placeholder="Email used during booking">
    </div>
    <button class="btn btn-primary" id="search-btn" style="width:auto; padding:11px 28px;" data-i18n="search_btn">Search</button>
  </div>

  <div id="result-area"></div>
</div>

<footer>
  <strong>여운 YeoUn</strong> &nbsp;—&nbsp; <span data-i18n="footer_slogan">Eat · Drink · Play — Seoul Style</span>
  <div class="footer-contact">
    <span>📞 010-7353-6514</span>
    <span>✉️ tnsrsmut1@naver.com</span>
  </div>
</footer>

<script src="js/api.js?v=20260325-2"></script>
<script src="js/i18n.js?v=20260325-2"></script>
<script>
const emailInput = document.getElementById('email-input');
const searchBtn  = document.getElementById('search-btn');
const resultArea = document.getElementById('result-area');
let cachedBookings = null;

function formatPrice(p) {
  return p.toLocaleString('ko-KR') + '원';
}

function formatDate(dateStr) {
  const d = new Date(dateStr);
  if (currentLang === 'zh') return d.toLocaleDateString('zh-CN', { year: 'numeric', month: 'long', day: 'numeric' });
  if (currentLang === 'en') return d.toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
  return d.toLocaleDateString('ko-KR', { year: 'numeric', month: 'long', day: 'numeric' });
}

function getTourName(b) {
  if (currentLang === 'en') return b.destinationNameEn || b.tourNameEn || b.destinationName || b.tourName || 'Tour';
  if (currentLang === 'zh') return b.destinationNameZh || b.tourNameZh || b.destinationName || b.tourName || '行程';
  return b.destinationName || b.tourName || '투어';
}

function getTourImage(b) {
  return b.destinationImage || b.tourImage || '';
}

function renderBookings(bookings) {
  if (bookings.length === 0) {
    resultArea.innerHTML = `
      <div class="empty-state">
        <div class="icon">📭</div>
        <p>${t('empty_no_booking')}</p>
        <a href="index.html" class="btn btn-outline" style="margin-top:16px; width:auto;">${t('explore_link')}</a>
      </div>`;
    return;
  }

  const countMsg = `${t('total_pre')}${bookings.length}${t('total_post')}`;
  const unit = currentLang === 'en' ? ' pax' : currentLang === 'zh' ? '人' : '명';
  const dateSuffix = currentLang === 'en' ? '' : t('depart_suffix');

  resultArea.innerHTML = `
    <p style="font-size:.85rem; color:var(--text-muted); margin-bottom:20px;">${countMsg}</p>
    ${bookings.map(b => `
      <div class="booking-card" id="card-${b.id}">
        <img class="booking-card-img" src="${getTourImage(b)}" alt="${getTourName(b)}" onerror="this.style.display='none'">
        <div class="booking-card-body">
          <div class="booking-card-name">${getTourName(b)}</div>
          <div class="booking-card-meta">${formatDate(b.date)}${dateSuffix} &nbsp;·&nbsp; ${b.travelers}${unit}</div>
          <div class="booking-card-meta" style="color:var(--text-muted);">${b.duration}</div>
          <div class="booking-card-price">${formatPrice(b.totalPrice)}</div>
          <div class="booking-card-footer">
            <button class="btn btn-ghost"
              style="width:auto; padding:8px 18px; font-size:.82rem; color:var(--danger); border-color:var(--danger);"
              onclick="cancelBooking(${b.id})"
              id="cancel-${b.id}"
              data-i18n="cancel_btn">${t('cancel_btn')}</button>
          </div>
        </div>
      </div>`).join('')}`;

  if (typeof applyI18n === 'function') applyI18n();
}

async function search() {
  const email = emailInput.value.trim();
  if (!email) {
    resultArea.innerHTML = `<p style="color:var(--danger); font-size:.88rem; padding:12px 0;">이메일을 입력해주세요.</p>`;
    return;
  }

  resultArea.innerHTML = `<div class="loading"><div class="spinner"></div><p>${t('loading_bookings')}</p></div>`;
  searchBtn.disabled = true;

  try {
    const bookings = await apiFetch(`/bookings?email=${encodeURIComponent(email)}`);
    cachedBookings = bookings;
    window.lastFetchedBookings = bookings;
    console.log('Fetched bookings:', bookings);
    resultArea.innerHTML = '';
  } catch (e) {
    console.error('Failed to fetch bookings:', e);
    resultArea.innerHTML = `<p style="color:var(--danger); white-space:pre-line; font-size:.88rem;">${t('query_error')}</p>`;
  } finally {
    searchBtn.disabled = false;
  }
}

async function cancelBooking(id) {
  if (!confirm(t('cancel_confirm'))) return;
  const btn = document.getElementById(`cancel-${id}`);
  btn.disabled = true;
  btn.textContent = t('canceling');

  try {
    const email = emailInput.value.trim();
    await apiFetch(`/bookings/${id}`, {
      method: 'DELETE',
      body: JSON.stringify({ email })
    });
    const card = document.getElementById(`card-${id}`);
    card.style.transition = 'opacity .4s, transform .4s';
    card.style.opacity = '0';
    card.style.transform = 'translateX(-10px)';
    setTimeout(() => {
      card.remove();
      if (cachedBookings) {
        cachedBookings = cachedBookings.filter(b => b.id !== id);
        if (cachedBookings.length === 0) {
          resultArea.innerHTML = `
            <div class="empty-state">
              <div class="icon">✅</div>
              <p>${t('empty_all_canceled') || '모든 예약이 취소되었습니다.'}</p>
              <a href="index.html" class="btn btn-outline" style="margin-top:16px; width:auto;">${t('explore_link')}</a>
            </div>`;
        }
      }
    }, 400);
  } catch (e) {
    btn.disabled = false;
    btn.textContent = t('cancel_btn');
    alert(t('query_error'));
  }
}

function onLangChange() {
  if (cachedBookings !== null) renderBookings(cachedBookings);
}

document.addEventListener('DOMContentLoaded', () => {
  searchBtn.addEventListener('click', search);
  emailInput.addEventListener('keydown', e => { if (e.key === 'Enter') search(); });
});
</script>
</body>
</html>
