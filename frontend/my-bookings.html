<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>내 예약 — 여운 Yeoun</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav>
  <div class="nav-inner">
    <a href="index.html" class="nav-logo">
      <span class="logo-ko">여운</span>
      <span class="logo-en">Yeoun Travel</span>
    </a>
    <div class="nav-links">
      <a href="index.html" data-i18n="nav_explore">여행지 탐색</a>
      <a href="guides.html" data-i18n="nav_guides">가이드 소개</a>
      <a href="my-bookings.html" class="active" data-i18n="nav_bookings">내 예약</a>
    </div>
    <div class="lang-switcher">
      <button class="lang-btn" data-lang="ko">KO</button>
      <button class="lang-btn" data-lang="en">EN</button>
      <button class="lang-btn" data-lang="zh">中文</button>
    </div>
  </div>
</nav>

<div class="container" style="max-width: 820px;">
  <div class="section-header">
    <div>
      <p class="section-title" data-i18n="my_title">내 예약 목록</p>
      <p class="section-sub" data-i18n="my_sub">이메일 주소로 예약 내역을 조회하세요.</p>
    </div>
  </div>

  <div class="email-search">
    <div class="form-group">
      <label for="email-input" data-i18n="label_email_search">이메일 주소</label>
      <input type="email" id="email-input" data-i18n-placeholder="ph_email_search" placeholder="예약 시 입력한 이메일">
    </div>
    <button class="btn btn-primary" id="search-btn" style="width:auto; padding: 11px 28px;" data-i18n="search_btn">조회하기</button>
  </div>

  <div id="result-area"></div>
</div>

<footer>
  <strong>여운 Yeoun</strong> &nbsp;—&nbsp; <span data-i18n="footer_slogan">여행이 끝난 후에도 오래 남는 기억</span>
  <div class="footer-contact">
    <span>📞 010-7353-6514</span>
    <span>✉️ tnsrsmut1@naver.com</span>
  </div>
</footer>

<script src="js/api.js"></script>
<script src="js/i18n.js"></script>
<script>
const emailInput = document.getElementById('email-input');
const searchBtn  = document.getElementById('search-btn');
const resultArea = document.getElementById('result-area');
let cachedBookings = null;

function formatDate(dateStr) {
  const d = new Date(dateStr);
  if (currentLang === 'zh') return d.toLocaleDateString('zh-CN', { year: 'numeric', month: 'long', day: 'numeric' });
  if (currentLang === 'en') return d.toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
  return d.toLocaleDateString('ko-KR', { year: 'numeric', month: 'long', day: 'numeric' });
}

function getDestName(b) {
  if (currentLang === 'en') return b.destinationNameEn || b.destinationName;
  if (currentLang === 'zh') return b.destinationNameZh || b.destinationName;
  return b.destinationName;
}

function renderBookings(bookings) {
  if (bookings.length === 0) {
    resultArea.innerHTML = `
      <div class="empty-state">
        <div class="icon">📭</div>
        <p>${t('empty_no_booking')}</p>
        <a href="index.html" class="btn btn-outline" style="margin-top:16px; width:auto;">${t('explore_link')}</a>
      </div>`;
    return;
  }

  const peopleUnit = currentLang === 'en' ? ' guest(s)' : currentLang === 'zh' ? '人' : '명';
  const departSuffix = t('depart_suffix');

  resultArea.innerHTML = `<p style="color:var(--text-muted); font-size:.875rem; margin-bottom:16px;">
    ${t('total_pre')}<strong>${bookings.length}</strong>${t('total_post')}</p>`;

  bookings.forEach(b => {
    const card = document.createElement('div');
    card.className = 'booking-card';
    card.id = `booking-${b.id}`;
    card.innerHTML = `
      <img src="${b.destinationImage}" alt="${getDestName(b)}">
      <div class="booking-info">
        <h3>${getDestName(b)}</h3>
        <div class="booking-meta">
          <span>🗓 ${localizedDuration(b.duration)}</span>
          <span>📅 ${formatDate(b.date)}${departSuffix}</span>
          <span>👥 ${b.travelers}${peopleUnit}</span>
        </div>
        <div style="font-size:.8rem; color:var(--text-muted); margin-top:5px;">
          ${t('booking_id_pre')}${String(b.id).padStart(6, '0')}
        </div>
      </div>
      <div style="display:flex; flex-direction:column; align-items:flex-end; gap:10px;">
        <span class="booking-price">₩${b.totalPrice.toLocaleString()}</span>
        <button class="btn btn-danger" onclick="cancelBooking(${b.id}, this)">${t('cancel_btn')}</button>
      </div>`;
    resultArea.appendChild(card);
  });
}

async function cancelBooking(id, btn) {
  if (!confirm(t('cancel_confirm'))) return;
  btn.disabled = true;
  btn.textContent = t('canceling');
  try {
    await apiFetch(`/bookings/${id}`, { method: 'DELETE' });
    const card = document.getElementById(`booking-${id}`);
    card.style.transition = 'opacity .3s, transform .3s';
    card.style.opacity = '0';
    card.style.transform = 'translateY(-8px)';
    setTimeout(() => {
      card.remove();
      if (resultArea.querySelectorAll('.booking-card').length === 0) {
        resultArea.innerHTML = `<div class="empty-state"><div class="icon">📭</div><p>${t('empty_all_canceled')}</p></div>`;
      }
    }, 300);
  } catch (err) {
    alert(err.error || '취소 중 오류가 발생했습니다.');
    btn.disabled = false;
    btn.textContent = t('cancel_btn');
  }
}

async function searchBookings() {
  const email = emailInput.value.trim();
  if (!email) { emailInput.focus(); return; }

  resultArea.innerHTML = `<div class="loading"><div class="spinner"></div><p>${t('loading_bookings')}</p></div>`;
  searchBtn.disabled = true;

  try {
    cachedBookings = await apiFetch(`/bookings?email=${encodeURIComponent(email)}`);
    renderBookings(cachedBookings);
  } catch {
    resultArea.innerHTML = `<div class="empty-state"><div class="icon">⚠️</div><p>${t('query_error')}</p></div>`;
  } finally {
    searchBtn.disabled = false;
  }
}

searchBtn.addEventListener('click', searchBookings);
emailInput.addEventListener('keydown', e => { if (e.key === 'Enter') searchBookings(); });

document.addEventListener('langchange', () => {
  if (cachedBookings) renderBookings(cachedBookings);
});

document.querySelectorAll('.lang-btn').forEach(btn => {
  btn.addEventListener('click', () => setLang(btn.dataset.lang));
});

initLang();
</script>

</body>
</html>
