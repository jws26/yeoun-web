<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>여운 Yeoun — 여행 예약</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✈️</text></svg>">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav>
  <div class="nav-inner">
    <a href="index.html" class="nav-logo">
      <span class="logo-ko">여운</span>
      <span class="logo-en">Yeoun Travel</span>
    </a>
    <div class="nav-links">
      <a href="index.html" class="active" data-i18n="nav_explore">여행지 탐색</a>
      <a href="guides.html" data-i18n="nav_guides">가이드 소개</a>
      <a href="my-bookings.html" data-i18n="nav_bookings">내 예약</a>
    </div>
    <div class="lang-switcher">
      <button class="lang-btn" data-lang="ko">KO</button>
      <button class="lang-btn" data-lang="en">EN</button>
      <button class="lang-btn" data-lang="zh">中文</button>
    </div>
  </div>
</nav>

<div class="hero">
  <div class="hero-ornament" data-i18n="hero_ornament">Yeoun Travel</div>
  <h1 class="hero-title" data-i18n="hero_title">서울이 남긴
여운</h1>
  <p data-i18n="hero_sub">스쳐 지나는 관광이 아닌
오래도록 마음에 머무는 서울의 경험을 선별합니다.</p>
  <div class="hero-scroll" data-i18n="hero_scroll">scroll ↓</div>
</div>

<div class="container">
  <div class="section-header">
    <div>
      <p class="section-title" data-i18n="section_title">여행 상품</p>
      <p class="section-sub">
        <span data-i18n="section_sub_pre">총 </span><strong id="dest-count">0</strong><span data-i18n="section_sub_post">개의 상품이 준비되어 있습니다.</span>
      </p>
    </div>
  </div>

  <div class="filter-tabs" id="filter-tabs" style="display:none;">
    <button class="filter-tab active" data-type="all">
      <span data-i18n="filter_all">전체</span> <span class="tab-count" id="count-all">0</span>
    </button>
    <button class="filter-tab" data-type="class">
      <span data-i18n="filter_class">원데이 클래스</span> <span class="tab-count" id="count-class">0</span>
    </button>
    <button class="filter-tab" data-type="tour-half">
      <span data-i18n="filter_half">반나절 투어</span> <span class="tab-count" id="count-tour-half">0</span>
    </button>
    <button class="filter-tab" data-type="tour-full">
      <span data-i18n="filter_full">하루 투어</span> <span class="tab-count" id="count-tour-full">0</span>
    </button>
  </div>

  <div id="loading" class="loading">
    <div class="spinner"></div>
    <p>불러오는 중...</p>
  </div>

  <div class="destinations-grid" id="destinations-grid" style="display:none;"></div>

  <div id="empty-filter" class="empty-state" style="display:none;">
    <div class="icon">🔍</div>
    <p>해당 카테고리의 상품이 없습니다.</p>
  </div>
</div>

<footer>
  <strong>여운 Yeoun</strong> &nbsp;—&nbsp; <span data-i18n="footer_slogan">여행이 끝난 후에도 오래 남는 기억</span>
  <div class="footer-contact">
    <span>📞 010-7353-6514</span>
    <span>✉️ tnsrsmut1@naver.com</span>
  </div>
</footer>

<script src="js/api.js"></script>
<script src="js/i18n.js"></script>
<script>
const TYPE_LABEL = {
  ko: { package: '패키지 여행', class: '원데이 클래스', 'tour-half': '반나절 투어', 'tour-full': '하루 투어' },
  en: { package: 'Package',     class: 'One-Day Class', 'tour-half': 'Half-Day Tour', 'tour-full': 'Full-Day Tour' },
  zh: { package: '套餐旅游',     class: '一日课程',       'tour-half': '半日游',         'tour-full': '全日游' }
};

let allDestinations = [];
let currentFilter = 'all';

function createCard(d) {
  const card = document.createElement('div');
  card.className = 'dest-card' + (d.comingSoon ? ' coming-soon' : '');
  card.dataset.type = d.type;

  const name = localizedField(d, 'name');
  const desc = localizedField(d, 'description');
  const typeLabel = (TYPE_LABEL[currentLang] || TYPE_LABEL.ko)[d.type] || d.type;
  const groupText = currentLang === 'en'
    ? `${d.minGroup}–${d.maxGroup} guests`
    : currentLang === 'zh'
    ? `${d.minGroup}~${d.maxGroup}人小团队`
    : `${d.minGroup}~${d.maxGroup}인 소규모`;

  const actionBtn = d.comingSoon
    ? `<button class="btn btn-coming-soon" disabled>${t('coming_soon_btn')}</button>`
    : `<a href="booking.html?id=${d.id}" class="btn btn-primary">${t('book_now')}</a>`;

  card.innerHTML = `
    <div class="dest-card-img-wrap">
      <img src="${d.image}" alt="${name}" loading="lazy">
      <span class="type-badge ${d.type}">${typeLabel}</span>
      ${d.comingSoon ? `<div class="coming-soon-overlay"><span class="coming-soon-label">Coming Soon</span></div>` : ''}
    </div>
    <div class="dest-card-body">
      <h3>${name}</h3>
      <p>${desc}</p>
      <div class="dest-meta">
        <span class="badge">🗓 ${localizedDuration(d.duration)}</span>
        <span class="price">₩${d.price.toLocaleString()}<span>${t('per_person')}</span></span>
      </div>
      <div class="group-info">👥 ${groupText}</div>
      ${actionBtn}
    </div>
  `;
  return card;
}

function applyFilter(type) {
  currentFilter = type;
  const grid = document.getElementById('destinations-grid');
  const emptyEl = document.getElementById('empty-filter');
  const filtered = type === 'all' ? allDestinations : allDestinations.filter(d => d.type === type);

  grid.innerHTML = '';
  if (filtered.length === 0) {
    grid.style.display = 'none';
    emptyEl.style.display = 'block';
  } else {
    emptyEl.style.display = 'none';
    grid.style.display = 'grid';
    filtered.forEach(d => grid.appendChild(createCard(d)));
  }
  document.querySelectorAll('.filter-tab').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.type === type);
  });
}


(async () => {
  try {
    allDestinations = await apiFetch('/destinations');

    document.getElementById('dest-count').textContent = allDestinations.length;
    document.getElementById('count-all').textContent = allDestinations.length;
    ['class', 'tour-half', 'tour-full'].forEach(t => {
      const el = document.getElementById(`count-${t}`);
      if (el) el.textContent = allDestinations.filter(d => d.type === t).length;
    });

    document.getElementById('loading').style.display = 'none';
    document.getElementById('filter-tabs').style.display = 'flex';
    applyFilter('all');

    document.getElementById('filter-tabs').addEventListener('click', (e) => {
      const tab = e.target.closest('.filter-tab');
      if (tab) applyFilter(tab.dataset.type);
    });

    // 언어 변경 시 카드 재렌더
    document.addEventListener('langchange', () => {
      applyFilter(currentFilter);
    });

  } catch (err) {
    document.getElementById('loading').innerHTML = `
      <div class="empty-state">
        <div class="icon">⚠️</div>
        <p>${t('server_error')}</p>
      </div>
    `;
  }
})();

// 언어 스위처
document.querySelectorAll('.lang-btn').forEach(btn => {
  btn.addEventListener('click', () => setLang(btn.dataset.lang));
});

initLang();
</script>

</body>
</html>
