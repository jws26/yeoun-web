<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>예약하기 — 여운 Yeoun</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav>
  <div class="nav-inner">
    <a href="index.html" class="nav-logo">
      <span class="logo-ko">여운</span>
      <span class="logo-en">Yeoun Travel</span>
    </a>
    <div class="nav-links">
      <a href="index.html" data-i18n="nav_explore">여행지 탐색</a>
      <a href="guides.html" data-i18n="nav_guides">가이드 소개</a>
      <a href="my-bookings.html" data-i18n="nav_bookings">내 예약</a>
    </div>
    <div class="lang-switcher">
      <button class="lang-btn" data-lang="ko">KO</button>
      <button class="lang-btn" data-lang="en">EN</button>
      <button class="lang-btn" data-lang="zh">中文</button>
    </div>
  </div>
</nav>

<div class="container" style="max-width: 660px;">

  <div id="dest-loading" class="loading">
    <div class="spinner"></div>
    <p>불러오는 중...</p>
  </div>

  <div id="dest-summary" class="dest-summary" style="display:none;">
    <img id="dest-img" src="" alt="">
    <div>
      <h2 id="dest-name"></h2>
      <p id="dest-duration"></p>
      <p id="dest-price-info"></p>
    </div>
  </div>

  <div id="form-section" style="display:none;">
    <div class="form-card">
      <h2 style="margin-bottom:6px; font-size:1.2rem; letter-spacing:0.06em;" data-i18n="booking_title">예약 정보 입력</h2>
      <p style="color:var(--text-muted); font-size:.845rem; margin-bottom:28px; letter-spacing:0.03em;" data-i18n="booking_sub">아래 정보를 입력하고 예약을 완료하세요.</p>

      <div id="alert" style="display:none;" class="alert"></div>

      <form id="booking-form">
        <div class="form-group">
          <label for="name" data-i18n="label_name">예약자 이름 *</label>
          <input type="text" id="name" data-i18n-placeholder="ph_name" placeholder="홍길동" required>
        </div>
        <div class="form-group">
          <label for="email" data-i18n="label_email">이메일 주소 *</label>
          <input type="email" id="email" placeholder="example@email.com" required>
        </div>
        <div class="form-group">
          <label for="travelers" data-i18n="label_travelers">인원 수 *</label>
          <select id="travelers" required></select>
          <p id="group-hint" style="margin-top:6px; font-size:0.78rem; color:var(--text-muted); letter-spacing:0.02em;"></p>
        </div>
        <div class="form-group">
          <label for="date" data-i18n="label_date">출발 날짜 *</label>
          <input type="date" id="date" required>
        </div>

        <div class="price-preview">
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <span style="font-size:.875rem; color:var(--text-muted);" data-i18n="total_label">예상 총 금액</span>
            <div class="total" id="total-price">-</div>
          </div>
          <div style="font-size:.8rem; color:var(--text-muted); margin-top:6px;" id="price-breakdown"></div>
        </div>

        <button type="submit" class="btn btn-primary" id="submit-btn" data-i18n="submit_btn">✈️ 예약 완료하기</button>
      </form>
    </div>
  </div>

  <div id="success-section" style="display:none;">
    <div class="success-card">
      <div class="success-icon">✅</div>
      <h2 data-i18n="success_title">예약이 완료되었습니다!</h2>
      <p class="success-sub-text" data-i18n="success_sub">소중한 여정이 기대됩니다.
예약 확인서는 이메일로 발송됩니다.</p>
      <div class="booking-id" id="booking-id-display"></div>
      <div class="btn-group">
        <a href="my-bookings.html" class="btn btn-primary" data-i18n="view_bookings">내 예약 보기</a>
        <a href="index.html" class="btn btn-outline" data-i18n="explore_more">더 둘러보기</a>
      </div>
    </div>
  </div>

</div>

<footer>
  <strong>여운 Yeoun</strong> &nbsp;—&nbsp; <span data-i18n="footer_slogan">여행이 끝난 후에도 오래 남는 기억</span>
  <div class="footer-contact">
    <span>📞 010-7353-6514</span>
    <span>✉️ tnsrsmut1@naver.com</span>
  </div>
</footer>

<script src="js/api.js"></script>
<script src="js/i18n.js"></script>
<script>
let destData = null;

function renderDestSummary(dest) {
  const name = localizedField(dest, 'name');
  document.getElementById('dest-name').textContent = name;
  document.getElementById('dest-duration').textContent = `🗓 ${localizedDuration(dest.duration)}`;
  document.getElementById('dest-price-info').textContent = `💰 ₩${dest.price.toLocaleString()}${t('per_person')}`;
}

function renderTravelersOptions(dest) {
  const select = document.getElementById('travelers');
  const selected = select.value;
  select.innerHTML = `<option value="">${t('ph_travelers')}</option>`;
  for (let i = dest.minGroup; i <= dest.maxGroup; i++) {
    const opt = document.createElement('option');
    opt.value = i;
    const unit = currentLang === 'en' ? (i === 1 ? ' guest' : ' guests') : currentLang === 'zh' ? '人' : '명';
    opt.textContent = `${i}${unit}`;
    if (String(i) === selected) opt.selected = true;
    select.appendChild(opt);
  }
  document.getElementById('group-hint').textContent =
    `${t('group_hint_pre')}${dest.minGroup}${t('group_hint_mid')}${dest.maxGroup}${t('group_hint_post')}`;
}

function updatePriceDisplay(n, price) {
  if (n > 0) {
    document.getElementById('total-price').textContent = `₩${(price * n).toLocaleString()}`;
    const unit = currentLang === 'en' ? (n === 1 ? ' guest' : ' guests') : currentLang === 'zh' ? '人' : '명';
    document.getElementById('price-breakdown').textContent = `₩${price.toLocaleString()} × ${n}${unit}`;
  }
}

(async () => {
  const params = new URLSearchParams(location.search);
  const destId = params.get('id');
  if (!destId) { location.href = 'index.html'; return; }

  document.getElementById('date').min = new Date().toISOString().split('T')[0];

  try {
    destData = await apiFetch(`/destinations/${destId}`);

    document.getElementById('dest-loading').style.display = 'none';
    document.getElementById('dest-summary').style.display = 'flex';
    document.getElementById('form-section').style.display = 'block';

    renderDestSummary(destData);
    renderTravelersOptions(destData);

    document.getElementById('travelers').addEventListener('change', (e) => {
      updatePriceDisplay(Number(e.target.value), destData.price);
    });

    document.getElementById('booking-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const alertEl = document.getElementById('alert');
      const submitBtn = document.getElementById('submit-btn');
      submitBtn.disabled = true;
      submitBtn.textContent = t('submitting');
      alertEl.style.display = 'none';

      try {
        const booking = await apiFetch('/bookings', {
          method: 'POST',
          body: JSON.stringify({
            destinationId: destId,
            name: document.getElementById('name').value.trim(),
            email: document.getElementById('email').value.trim(),
            travelers: document.getElementById('travelers').value,
            date: document.getElementById('date').value
          })
        });
        document.getElementById('form-section').style.display = 'none';
        document.getElementById('dest-summary').style.display = 'none';
        document.getElementById('success-section').style.display = 'block';
        document.getElementById('booking-id-display').textContent =
          `${t('booking_id_pre')}${String(booking.id).padStart(6, '0')}`;
      } catch (err) {
        alertEl.className = 'alert alert-error';
        alertEl.textContent = err.error || '예약 중 오류가 발생했습니다.';
        alertEl.style.display = 'block';
        submitBtn.disabled = false;
        submitBtn.textContent = t('submit_btn');
      }
    });

  } catch (err) {
    document.getElementById('dest-loading').innerHTML = `
      <div class="empty-state"><div class="icon">⚠️</div>
      <p><a href="index.html">← 목록으로 돌아가기</a></p></div>`;
  }
})();

document.addEventListener('langchange', () => {
  if (!destData) return;
  renderDestSummary(destData);
  renderTravelersOptions(destData);
  const n = Number(document.getElementById('travelers').value);
  if (n > 0) updatePriceDisplay(n, destData.price);
});

document.querySelectorAll('.lang-btn').forEach(btn => {
  btn.addEventListener('click', () => setLang(btn.dataset.lang));
});

initLang();
</script>

</body>
</html>
